[project]
name = "family_travel_planner"
version = "0.1.0"
description = "family_travel_planner using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,litellm,tools]==1.10.1",
    "lancedb==0.30.0",
    "gradio>=4.44.0",
]

[project.scripts]
family_travel_planner = "family_travel_planner.main:run"
run_crew = "family_travel_planner.main:run"
family_travel_planner_ui = "family_travel_planner.app:main"
train = "family_travel_planner.main:train"
replay = "family_travel_planner.main:replay"
test = "family_travel_planner.main:test"
run_with_trigger = "family_travel_planner.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
